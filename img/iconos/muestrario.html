<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconos de Para el Carro</title>
<style>
  body { background: #14161c; color: #efe6d6; font-family: system-ui, sans-serif; margin: 16px; }
  .fila { display: flex; gap: 18px; flex-wrap: wrap; align-items: end; }
  figure { margin: 0; text-align: center; }
  .g img { width: 120px; background: #2a2f3a; border-radius: 16px; padding: 8px; }
  .p img { width: 28px; }
  .claro { background: #f3e9d6; padding: 12px; border-radius: 12px; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Iconos</h1>
  <div class="fila g">
    <figure><img src="subir.svg" alt=""><figcaption>Subir la cifra</figcaption></figure>
    <figure><img src="carreta.svg" alt=""><figcaption>Me quedo en el carro</figcaption></figure>
    <figure><img src="bajar.svg" alt=""><figcaption>Me bajo del carro</figcaption></figure>
    <figure><img src="burra.svg" alt=""><figcaption>Conductor (burra)</figcaption></figure>
  </div>
  <h2>En los botones (tamaño real)</h2>
  <div class="fila p"><img src="subir.svg" alt=""><img src="carreta.svg" alt=""><img src="bajar.svg" alt=""><img src="burra.svg" alt=""></div>
  <div class="fila p claro"><img src="subir.svg" alt=""><img src="carreta.svg" alt=""><img src="bajar.svg" alt=""><img src="burra.svg" alt=""></div>
</body>
</html>
